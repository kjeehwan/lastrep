name: Web Export Check

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feature/**

jobs:
  web-export:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: test
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: test-project
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      EXPO_PUBLIC_FIREBASE_APP_ID: "1:1234567890:web:test"
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: G-TEST1234
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: test-android-client
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: test-ios-client
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: test-web-client
      EXPO_PUBLIC_REVENUECAT_API_KEY: test-revenuecat
      EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID: test-revenuecat-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo web export
        run: npm run check:web-export
