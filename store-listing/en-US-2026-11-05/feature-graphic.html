<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Lastrep feature graphic</title>
  <style>
    @font-face { font-family: 'LastrepEditorial'; src: url('../../assets/fonts/source-serif-4.ttf'); font-weight: 400; font-style: normal; }
    * { box-sizing: border-box; }
    html, body { width: 1024px; height: 500px; margin: 0; overflow: hidden; }
    body { background: #f5f1e8; color: #272923; display: flex; align-items: center; justify-content: center; }
    main { display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .brand { display: block; width: 480px; height: 160px; }
    h1 { margin: 0; font: 400 35px/1.2 'LastrepEditorial', Georgia, serif; letter-spacing: -.025em; }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="../../hosting/workout-sharing/wordmark.svg" alt="Lastrep">
    <h1>Build on your last rep.</h1>
  </main>
</body>
</html>
