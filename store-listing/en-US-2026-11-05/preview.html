<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lastrep — Play listing assets</title><style>body{margin:32px auto;max-width:1100px;padding:0 20px;background:#f5f1e8;color:#272923;font:16px/1.5 system-ui}h1{font-family:Georgia,serif}a{color:#a33d24}button{padding:10px 18px;margin:0 8px 12px 0;background:#fffcf5;color:#272923;border:1px solid #c9c4b8;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#272923;color:#fff}#graphic{display:block;width:100%;max-width:1024px;margin:24px 0 40px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px}figure{margin:0}figure img{width:100%;display:block;border:1px solid #d9d5ca}figcaption{padding:8px 0 20px}small{color:#65675f}</style><h1>Lastrep — Google Play listing</h1><p><a href="short-description.txt">Short description</a> · <a href="full-description.txt">Full description</a> · <a href="README.md">Upload guide</a></p><h2>Feature graphic</h2><img id="graphic" src="feature-graphic.png" alt="Build on your last rep — Lastrep feature graphic"><h2>Screenshots</h2><p><button data-folder="phone">Phone</button><button data-folder="tablet-7-inch">7-inch tablet</button><button data-folder="tablet-10-inch">10-inch tablet</button></p><p><small>Tap an image to open it at full resolution. Upload each device folder in the numbered order.</small></p><div class="grid" id="screens"></div><script>const names=['01-home-progress','02-workout','03-program','04-nutrition','05-food-search','06-sleep','07-sharing','08-recovery'];function show(folder){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.folder===folder)));document.getElementById('screens').innerHTML=names.map((n,i)=>`<figure><a href="${folder}/${folder}-${n}.png" target="_blank"><img loading="lazy" src="${folder}/${folder}-${n}.png" alt="${n.slice(3).replaceAll('-',' ')}"></a><figcaption>${i+1}. ${n.slice(3).replaceAll('-',' ')}</figcaption></figure>`).join('')}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.folder));show('phone');</script></html>
