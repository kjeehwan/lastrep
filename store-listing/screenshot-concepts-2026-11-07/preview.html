<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lastrep — Google Play screenshot review</title>
<style>
body{margin:0;padding:32px;background:#f6f2e9;color:#242720;font-family:system-ui,sans-serif}h1{margin:0 0 12px;font-size:26px}p{color:#625f55;max-width:780px;line-height:1.5}nav{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}button{font:inherit;padding:10px 16px;border:1px solid #817b6e;border-radius:6px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#242720;color:#fffcf5}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}figure{margin:0;min-width:0}img{display:block;width:100%;height:auto;box-shadow:0 3px 16px #24272012}figcaption{padding:12px 0;font-size:14px}a{color:inherit}@media(max-width:1100px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){body{padding:20px}main{grid-template-columns:1fr}}
</style>
<h1>Lastrep · Google Play screenshots</h1>
<p>Eight images in app-tab order: Home → Workout (including programs, Today’s Plan and sharing) → Nutrition → Sleep → Profile. Select a device group, then open an image to inspect its upload file.</p>
<nav aria-label="Device group"></nav><main></main>
<script src="catalog.js"></script>
<script>
const names=['Phone','7-inch tablet','10-inch tablet'];
function show(device){document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.device===device.key)));document.querySelector('main').replaceChildren(...listingScreens.map(s=>{const f=document.createElement('figure'),a=document.createElement('a'),i=document.createElement('img'),c=document.createElement('figcaption');a.href=`${device.key}/${device.key}-${s.stem}.png`;i.src=a.href;i.alt=s.alt;c.textContent=`${s.stem.slice(0,2)} · ${s.headline}`;a.append(i);f.append(a,c);return f}));}
listingDevices.forEach((d,n)=>{const b=document.createElement('button');b.textContent=names[n];b.dataset.device=d.key;b.onclick=()=>show(d);document.querySelector('nav').append(b)});show(listingDevices[0]);
</script>
</html>
